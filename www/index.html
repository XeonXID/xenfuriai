<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XENMUSIC</title>
    <script src="cordova.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .loading-screen {
            text-align: center;
            color: #ffffff;
        }
        .loading-screen img {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            margin-bottom: 16px;
        }
        /* Spinner sederhana saat loading awal */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-screen p {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>
    <div class="loading-screen">
        <img src="https://i.ibb.co.com/XfRz0dRK/Gemini-Generated-Image-czbaugczbaugczba.png" alt="XENMUSIC" />
        <div class="loader"></div>
        <p>Memuat XENMUSIC...</p>
    </div>

<script>
document.addEventListener("deviceready", function () {

    // Ganti dengan domain XENMUSIC kamu yang sebenarnya
    var targetUrl = "https://xenmusic.xenstudio.my.id/";

    /**
     * Membuka InAppBrowser
     * - location=no             -> sembunyikan bar alamat/URL
     * - zoom=no                 -> cegah user zoom manual
     * - clearcache=yes          -> bersihkan cache setiap buka
     * - clearsessioncache=yes
     * - hidenavigationbuttons=yes -> sembunyikan tombol nav bawaan InAppBrowser
     * - toolbarcolor=#121212    -> samakan warna toolbar dgn tema gelap XENMUSIC
     */
    var iab = cordova.InAppBrowser.open(
        targetUrl,
        '_blank',
        'location=no,zoom=no,clearcache=yes,clearsessioncache=yes,hidenavigationbuttons=yes,toolbarcolor=%23121212,hidespinner=yes'
    );

    // Mencegah aplikasi tertutup saat tekan tombol Back di Android.
    // Coba mundur di history webview dulu; kalau tidak ada history,
    // baru keluar dari aplikasi.
    document.addEventListener("backbutton", function (e) {
        e.preventDefault();
        iab.executeScript({ code: "window.history.length" }, function (values) {
            var historyLength = values && values[0];
            if (historyLength && historyLength > 1) {
                iab.executeScript({ code: "history.back();" });
            } else {
                iab.close();
                navigator.app.exitApp();
            }
        });
    }, false);

    // Jika user menutup browser (klik tombol done/close), tutup aplikasi
    iab.addEventListener('exit', function () {
        navigator.app.exitApp();
    });

}, false);
</script>
</body>
</html>
